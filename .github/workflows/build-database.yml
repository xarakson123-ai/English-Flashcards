name: Build 40000 word database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/build-database.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build database
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("data").glob("*.json"))
          out=[]
          seen=set()
          for f in files:
              try:
                  data=json.loads(f.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for w in data:
                  if isinstance(w,dict):
                      en=w.get("en") or w.get("word")
                      pl=w.get("pl")
                      if not pl:
                          m=w.get("meaning")
                          if isinstance(m,list) and m:
                              pl=m[0]
                      if en and pl:
                          key=(str(en).strip().lower(),str(pl).strip().lower())
                          if key not in seen:
                              seen.add(key)
                              out.append({"en":str(en).strip(),"pl":str(pl).strip()})
          if len(out) < 40000:
              raise SystemExit(f"Database contains only {len(out)} usable entries")
          Path("words.json").write_text(json.dumps(out[:40000],ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print(f"Built {len(out[:40000])} words")
          PY
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words.json
          git diff --cached --quiet || git commit -m "Aktualizuj bazę 40000 słówek"
          git push