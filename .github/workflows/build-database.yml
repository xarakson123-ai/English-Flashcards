name: Build 40000 word database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/*.json"
      - ".github/workflows/build-database.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build database
        shell: python
        run: |
          import json
          from pathlib import Path
          levels=["A1","A2","B1","B2","C1"]
          quota=8000
          rows=[]
          seen=set()
          for f in sorted(Path("data").glob("*.json")):
              try:
                  data=json.loads(f.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for w in data:
                  if not isinstance(w,dict):
                      continue
                  en=str(w.get("word") or w.get("en") or "").strip()
                  meanings=w.get("meaning") or []
                  pl=str(w.get("pl") or (meanings[0] if meanings else "")).strip()
                  level=str(w.get("level") or "").upper().strip()
                  import re
                  if not en or not pl or level not in levels:
                      continue
                  if re.fullmatch(r"[A-Za-z]{1,6}\\.",en):
                      continue
                  key=(en.lower(),pl.lower())
                  if key in seen:
                      continue
                  seen.add(key)
                  rows.append({"en":en,"pl":pl,"level":level,"sourceLevel":True})
          if len(rows)<40000:
              try:
                  import urllib.request
                  url="https://raw.githubusercontent.com/open-dict-data/wikidict-en/master/data/pl-en_wiki.txt"
                  raw=urllib.request.urlopen(url,timeout=60).read().decode("utf-8","ignore")
                  for line in raw.splitlines():
                      parts=line.split("\t")
                      if len(parts)<2:
                          continue
                      pl=parts[0].strip()
                      en=parts[1].strip()
                      key=(en.lower(),pl.lower())
                      import re
                      if not en or not pl or key in seen:
                          continue
                      if re.fullmatch(r"[A-Za-z]{1,6}\\.",en):
                          continue
                      seen.add(key)
                      rows.append({"en":en,"pl":pl,"level":None,"sourceLevel":False})
                      if len(rows)>=60000:
                          break
              except Exception as e:
                  print("External dictionary error:",e)
          ranked=[w for w in rows if not w["sourceLevel"]]
          ranked.sort(key=lambda w:(len(w["en"]),w["en"].lower()))
          by={x:[] for x in levels}
          for w in rows:
              if w["sourceLevel"]:
                  by[w["level"]].append(w)
          used=set(id(w) for level in levels for w in by[level])
          remaining=[w for w in ranked if id(w) not in used]
          pos=0
          for level in levels:
              need=max(0,quota-len(by[level]))
              by[level].extend(remaining[pos:pos+need])
              for w in by[level][-need:] if need else []:
                  w["level"]=level
              pos+=need
          selected=[]
          titles=[
            "Podstawy i codzienne życie","Ludzie i relacje","Dom i otoczenie","Jedzenie i zakupy",
            "Szkoła i nauka","Czas i rutyna","Miasto i miejsca","Podróże i transport",
            "Praca i obowiązki","Zdrowie i ciało","Hobby i rozrywka","Przyroda i pogoda",
            "Technologia i media","Emocje i opinie","Czasowniki i zwroty","Przymiotniki i opisy",
            "Rzeczowniki i pojęcia","Komunikacja","Życie społeczne","Powtórka poziomu"
          ]
          for level in levels:
              group=by[level][:quota]
              if len(group)<quota:
                  raise SystemExit(f"Level {level} has only {len(group)} entries")
              for i,w in enumerate(group):
                  w.pop("sourceLevel",None)
                  w["chapter"]=i//400+1
                  w["chapterTitle"]=titles[i//400]
                  selected.append(w)
          if len(selected)!=40000:
              raise SystemExit(f"Database contains only {len(selected)} entries")
          Path("words.json").write_text(json.dumps(selected,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          outdir=Path("data/generated")
          outdir.mkdir(parents=True,exist_ok=True)
          for level in levels:
              group=[w for w in selected if w["level"]==level]
              for c in range(1,21):
                  chunk=group[(c-1)*400:c*400]
                  (outdir/f"{level}-{c:02d}.json").write_text(json.dumps(chunk,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print(f"Built {len(selected)} words and 100 offline chapter files")
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words.json data/generated
          git diff --cached --quiet || git commit -m "Zbuduj bazę 40000 słówek A1-C1"
          git push