<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Flashcards</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#29204d,#0b0911 62%);color:#fff;min-height:100vh}.app{max-width:1150px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:30px;font-weight:900}.muted{color:#aaa7b7}.pill{padding:9px 14px;border:1px solid #3b3650;border-radius:999px;background:#181522}.panel{margin-top:20px;background:#15121e;border:1px solid #302b40;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0008}.screen{display:none}.screen.active{display:block}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.level{padding:14px;border-radius:16px;border:1px solid #3b344b;background:#1b1726;text-align:center;font-weight:900}.level.active{border-color:#9b6cff;background:#281d3d}.level.locked{opacity:.45}.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.chapter{position:relative;text-align:left;padding:18px;border:1px solid #393248;background:#1b1726;color:#fff;border-radius:18px;cursor:pointer;min-height:130px}.chapter:hover:not(:disabled){transform:translateY(-2px);background:#241d32}.chapter:disabled{cursor:not-allowed}.chapter.locked{opacity:.42}.chapter.done{border-color:#287d58}.num{font-size:12px;color:#a99bc4;font-weight:800}.ctitle{font-size:18px;font-weight:900;margin:7px 0}.cinfo{font-size:13px;color:#aaa7b7}.lock{position:absolute;right:14px;top:14px}.mini{height:7px;background:#2a2635;border-radius:99px;overflow:hidden;margin-top:12px}.mini i{display:block;height:100%;width:0;background:#9b6cff}.stats{display:flex;gap:10px;flex-wrap:wrap}.progress{height:10px;background:#2a2635;border-radius:99px;overflow:hidden;margin:18px 0}.bar{height:100%;background:linear-gradient(90deg,#9b6cff,#d26cff);width:0}.card{height:390px;perspective:1200px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;border:1px solid #4b405f;background:linear-gradient(145deg,#302548,#171321)}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#422d5d,#181321)}.word{font-size:clamp(40px,8vw,78px);font-weight:900}.translation{font-size:clamp(30px,6vw,56px);font-weight:800}.hint{position:absolute;bottom:22px;font-size:14px;color:#aaa}.actions{display:flex;gap:12px;margin-top:14px}.btn{flex:1;border:0;border-radius:15px;padding:15px;font-size:17px;font-weight:800;cursor:pointer;color:#fff;background:#29233a}.btn:hover{filter:brightness(1.15)}.know{background:#287d58}.dont{background:#a13e56}.secondary{margin-top:12px;background:#201b2c}.library{display:flex;gap:10px;margin-bottom:14px}.library input{flex:1;padding:14px;border-radius:12px;border:1px solid #40384f;background:#0e0b14;color:#fff}.list{max-height:360px;overflow:auto}.row{display:flex;justify-content:space-between;padding:11px;border-bottom:1px solid #2c2735}.result{text-align:center;padding:35px}.score{font-size:64px;font-weight:900}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.answer{border:1px solid #3d3650;background:#211b2d;color:#fff;border-radius:15px;padding:18px;text-align:left;font-size:17px;font-weight:800;cursor:pointer}.answer:hover{background:#302544}.answer.correct{border-color:#287d58;background:#1b4937}.answer.wrong{border-color:#a13e56;background:#542233}.answer:disabled{cursor:default;opacity:.95}.testword{font-size:clamp(30px,6vw,54px);font-weight:900}.error{color:#ff8fa7;text-align:center;padding:20px}@media(max-width:800px){.levels{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.app{padding:14px}.top{align-items:flex-start;flex-direction:column}.card{height:330px}.actions{flex-direction:column}.levels{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="brand">English Flashcards</div><div class="muted">40 000 słówek • A1 → C1</div></div><div class="pill" id="count">Ładowanie…</div></div>
<div id="menu" class="screen active panel">
<h2>📚 Kurs angielskiego</h2>
<p class="muted">Uczysz się jak z książki: poziomy, rozdziały i powtórki. Wyższy poziom odblokuje się dopiero po ukończeniu poprzedniego.</p>
<div class="levels" id="levels"></div>
<div class="chapters" id="chapters"></div>
</div>
<div id="game" class="screen panel">
<div class="stats"><div class="pill" id="progressText"></div><div class="pill" id="scoreText"></div><div class="pill" id="chapterText"></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card" id="card" onclick="flip()"><div class="inner"><div class="face"><div class="word" id="en"></div><div class="hint">Kliknij kartę, aby zobaczyć tłumaczenie</div></div><div class="face back"><div class="translation" id="pl"></div></div></div></div>
<div class="actions"><button class="btn dont" onclick="answer(false)">✕ Nie znam</button><button class="btn know" onclick="answer(true)">✓ Znam</button></div>
<button class="btn secondary" onclick="menu()">← Wróć do rozdziałów</button>
</div>
<div id="result" class="screen panel result"><h2 id="resultTitle"></h2><div class="score" id="finalScore"></div><p class="muted" id="finalText"></p><button class="btn" onclick="continueToTest()">📝 Test końcowy</button><button class="btn secondary" onclick="retry()">Powtórz 400 słówek</button><button class="btn secondary" onclick="menu()">Rozdziały</button></div>
<div id="test" class="screen panel"><div class="stats"><div class="pill" id="testProgress"></div><div class="pill" id="testScore"></div><div class="pill" id="testChapter"></div></div><div class="progress"><div class="bar" id="testBar"></div></div><div class="panel" style="margin-top:14px"><div class="muted" id="testType"></div><h2 id="question"></h2><div id="answers" class="answers"></div></div><button class="btn secondary" onclick="menu()">← Wróć do rozdziałów</button></div>
<div id="library" class="screen panel"><h2>🔎 Baza słówek</h2><div class="library"><input id="search" placeholder="Szukaj po angielsku lub polsku" oninput="renderLibrary()"></div><div class="list" id="list"></div><button class="btn secondary" onclick="menu()">← Rozdziały</button></div>
<div id="err" class="error"></div>
</div>
<script>
const LEVELS=["A1","A2","B1","B2","C1"];
const CHAPTER_TITLES=["Podstawy i codzienne życie","Ludzie i relacje","Dom i otoczenie","Jedzenie i zakupy","Szkoła i nauka","Czas i rutyna","Miasto i miejsca","Podróże i transport","Praca i obowiązki","Zdrowie i ciało","Hobby i rozrywka","Przyroda i pogoda","Technologia i media","Emocje i opinie","Czasowniki i zwroty","Przymiotniki i opisy","Rzeczowniki i pojęcia","Komunikacja","Życie społeczne","Powtórka poziomu"];
let words=[],deck=[],index=0,score=0,current=null,level="A1",testDeck=[],testIndex=0,testScore=0,testAnswered=false;
const completed=JSON.parse(localStorage.getItem("flashcardsCompleted")||"[]");
const progress=JSON.parse(localStorage.getItem("flashcardsProgress")||"{}");
function save(){localStorage.setItem("flashcardsCompleted",JSON.stringify(completed));localStorage.setItem("flashcardsProgress",JSON.stringify(progress))}
async function load(){
 try{
  document.getElementById("count").textContent="40 000 słówek";
  renderMenu();
 }catch(e){document.getElementById("err").textContent="Nie udało się wczytać bazy. Sprawdź, czy GitHub Pages zakończyło wdrażanie."}
}
function key(l,c){return l+"-"+c}
function levelDone(l){return Array.from({length:20},(_,i)=>completed.includes(key(l,i+1))).every(Boolean)}
function unlocked(l){
 const i=LEVELS.indexOf(l);
 return i===0||levelDone(LEVELS[i-1])
}
function chapterDone(l,c){return completed.includes(key(l,c))}
function chapterProgress(l,c){return progress[key(l,c)]||0}
function renderMenu(){
 const ls=document.getElementById("levels");
 ls.innerHTML=LEVELS.map(l=>'<button class="level '+(l===level?'active ':'')+(unlocked(l)?'':' locked')+'" onclick="chooseLevel(\''+l+'\')">'+l+(unlocked(l)?' 🔓':' 🔒')+'</button>').join("");
 const max=20;
 const ch=document.getElementById("chapters");
 ch.innerHTML="";
 for(let c=1;c<=20;c++){
  const exists=c<=max;
  const prev=c===1||chapterDone(level,c-1);
  const can=unlocked(level)&&prev&&exists;
  const done=chapterDone(level,c);
  const p=chapterProgress(level,c);
  const title=CHAPTER_TITLES[c-1];
  const b=document.createElement("button");
  b.className="chapter "+(done?"done ":"")+(can?"":"locked");
  b.disabled=!can;
  b.innerHTML='<span class="num">ROZDZIAŁ '+c+'</span><div class="ctitle">'+title+'</div><div class="cinfo">'+(done?"✓ Ukończony":can?"400 słówek • test końcowy":"🔒 Ukończ poprzedni rozdział")+'</div><div class="mini"><i style="width:'+p+'%"></i></div><span class="lock">'+(can?"▶":"🔒")+'</span>';
  b.onclick=()=>startChapter(level,c);
  ch.appendChild(b);
 }
}
function chooseLevel(l){if(unlocked(l)){level=l;renderMenu()}}
async function startChapter(l,c){
 if(!unlocked(l)||(c>1&&!chapterDone(l,c-1)))return;
 current={level:l,chapter:c};
 try{
  const r=await fetch("data/generated/"+l+"-"+String(c).padStart(2,"0")+".json");
  if(!r.ok)throw Error();
  const pool=await r.json();
  if(!pool.length)throw Error();
  deck=shuffle(pool);
  index=0;score=0;screen("game");render();
 }catch(e){
  document.getElementById("err").textContent="Nie udało się wczytać rozdziału. Odśwież stronę.";
 }
}
function retry(){if(current)startChapter(current.level,current.chapter)}
function continueToTest(){
 if(score/deck.length<.8)return;
 testDeck=buildTest(deck);
 testIndex=0;
 testScore=0;
 testAnswered=false;
 renderTest();
 screen("test");
}
function buildTest(pool){
 const shuffled=shuffle(pool);
 const count=Math.min(20,shuffled.length);
 return shuffled.slice(0,count).map(w=>{
  const wrong=shuffle(pool.filter(x=>x!==w&&x.pl!==w.pl)).slice(0,3).map(x=>x.pl);
  const choices=shuffle([w.pl,...wrong]);
  return {word:w.en,correct:w.pl,choices};
 });
}
function renderTest(){
 const q=testDeck[testIndex];
 document.getElementById("testProgress").textContent=(testIndex+1)+" / "+testDeck.length;
 document.getElementById("testScore").textContent="Wynik: "+testScore;
 document.getElementById("testChapter").textContent=current.level+" • Rozdział "+current.chapter;
 document.getElementById("testBar").style.width=(testIndex/testDeck.length*100)+"%";
 document.getElementById("testType").textContent="Wybierz najlepsze tłumaczenie";
 document.getElementById("question").innerHTML='<span class="testword">'+esc(q.word)+'</span>';
 const box=document.getElementById("answers");
 box.innerHTML="";
 q.choices.forEach((choice,i)=>{
  const b=document.createElement("button");
  b.className="answer";
  b.textContent=String.fromCharCode(65+i)+") "+choice;
  b.onclick=()=>answerTest(choice,b);
  box.appendChild(b);
 });
}
function answerTest(choice,button){
 if(testAnswered)return;
 testAnswered=true;
 const q=testDeck[testIndex];
 const buttons=[...document.querySelectorAll(".answer")];
 buttons.forEach(b=>b.disabled=true);
 if(choice===q.correct){
  testScore++;
  button.classList.add("correct");
 }else{
  button.classList.add("wrong");
  const correctButton=buttons.find(b=>b.textContent===""+String.fromCharCode(65+q.choices.indexOf(q.correct))+") "+q.correct);
  if(correctButton)correctButton.classList.add("correct");
 }
 setTimeout(()=>{
  testIndex++;
  testAnswered=false;
  if(testIndex>=testDeck.length)finishTest();
  else renderTest();
 },650);
}
function finishTest(){
 const pct=Math.round(testScore/testDeck.length*100);
 const k=key(current.level,current.chapter);
 if(pct>=80){
  if(!completed.includes(k))completed.push(k);
  progress[k]=100;
  save();
  document.getElementById("resultTitle").textContent="🏆 Test zaliczony!";
  document.getElementById("finalText").textContent="Wynik testu: "+testScore+" / "+testDeck.length+" ("+pct+"%). Odblokowano kolejny rozdział.";
 }else{
  document.getElementById("resultTitle").textContent="❌ Test niezaliczony";
  document.getElementById("finalText").textContent="Wynik testu: "+testScore+" / "+testDeck.length+" ("+pct+"%). Potrzebujesz minimum 80%.";
 }
 document.getElementById("finalScore").textContent=testScore+" / "+testDeck.length;
 document.querySelector("#result .btn").style.display="none";
 screen("result");
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function render(){
 const w=deck[index];
 document.getElementById("en").textContent=w.en;
 document.getElementById("pl").textContent=w.pl;
 document.getElementById("card").classList.remove("flipped");
 document.getElementById("progressText").textContent=(index+1)+" / "+deck.length;
 document.getElementById("scoreText").textContent="Wynik: "+score;
 document.getElementById("chapterText").textContent=current.level+" • Rozdział "+current.chapter;
 document.getElementById("bar").style.width=(index/deck.length*100)+"%";
}
function flip(){document.getElementById("card").classList.toggle("flipped")}
function answer(ok){
 if(ok)score++;
 index++;
 if(index>=deck.length){
  const pct=Math.round(score/deck.length*100);
  const k=key(current.level,current.chapter);
  progress[k]=Math.max(progress[k]||0,pct);
  if(pct>=80&&!completed.includes(k))completed.push(k);
  save();
  document.getElementById("finalScore").textContent=score+" / "+deck.length;
  document.getElementById("resultTitle").textContent=pct>=80?"🎉 Rozdział ukończony!":"💪 Spróbuj jeszcze raz";
  document.getElementById("finalText").textContent=pct>=80?"Masz co najmniej 80%. Odblokowano kolejny rozdział.":"Potrzebujesz minimum 80%, aby odblokować następny rozdział.";
  screen("result");
 }else render()
}
function screen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
function menu(){renderMenu();screen("menu")}
function showLibrary(){screen("library");renderLibrary()}
function renderLibrary(){const q=(document.getElementById("search").value||"").toLowerCase();const arr=words.filter(w=>(w.en+" "+w.pl).toLowerCase().includes(q)).slice(0,300);document.getElementById("list").innerHTML=arr.map(w=>"<div class='row'><b>"+esc(w.en)+"</b><span>"+esc(w.pl)+"</span></div>").join("")||"<div class='muted'>Brak wyników</div>"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
load();
</script>
<script>if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js")}</script></body>
</html>
